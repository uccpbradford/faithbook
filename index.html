    <script>
      // Set the theme before the page paints, so a dark page does not flash white.
      // src/ui/theme.ts owns the setting once the app loads.
      try {
        var theme = localStorage.getItem('theme');
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
